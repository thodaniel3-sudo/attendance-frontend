<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg-dark: #0a0a0f;
    --bg-gradient: radial-gradient(circle at top, #1a1a2e 0%, #0a0a0f 100%);
    --glass-bg: rgba(20, 20, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-main: #f5f5f5;
    --gold-primary: #d4af37;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 1000px;
    margin: 0 auto;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    border-bottom: 1px solid var(--glass-border);
    padding-bottom: 15px;
  }
  h1 { color: var(--gold-primary); margin: 0; font-size: 24px; }
  
  .controls {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  input, select {
    padding: 12px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: white;
    font-size: 14px;
    outline: none;
  }
  input:focus, select:focus { border-color: var(--gold-primary); }
  
  button {
    padding: 12px 20px;
    background: linear-gradient(135deg, #2e7d32, #1b5e20);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { transform: translateY(-2px); opacity: 0.9; }
  button.logout { background: #c62828; }

  .table-container {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
  }
  table { width: 100%; border-collapse: collapse; text-align: left; }
  th, td { padding: 15px; border-bottom: 1px solid var(--glass-border); }
  th { background: rgba(0,0,0,0.3); color: var(--gold-primary); font-weight: 600; }
  tr:hover { background: rgba(255,255,255,0.05); }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Admin Dashboard</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by Course or Lecturer..." oninput="renderTable()">
    <select id="sortSelect" onchange="renderTable()">
      <option value="newest">Newest First</option>
      <option value="oldest">Oldest First</option>
    </select>
    <button onclick="downloadCSV()">📥 Download CSV</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Student ID</th>
          <th>Course</th>
          <th>Lecturer</th>
          <th>Date & Time</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="4" style="text-align:center;">Loading data...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API_URL = "https://attendance-system-backend-3ppe.onrender.com/api";
const adminPin = sessionStorage.getItem('admin_pin');
let allData = [];

// Check if logged in
if (!adminPin) {
  window.location.href = 'admin-login.html';
}

async function fetchData() {
  try {
    const res = await fetch(`${API_URL}/admin/attendance`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_pin: adminPin })
    });
    const data = await res.json();
    
    if (data.ok) {
      allData = data.attendance;
      renderTable();
    } else {
      alert(data.error);
      logout();
    }
  } catch (err) {
    document.getElementById('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ff6b6b;">Failed to load data. Backend might be waking up.</td></tr>';
  }
}

function renderTable() {
  const tbody = document.getElementById('tableBody');
  const search = document.getElementById('searchInput').value.toLowerCase();
  const sort = document.getElementById('sortSelect').value;
  
  // Filter
  let filtered = allData.filter(item => 
    (item.course && item.course.toLowerCase().includes(search)) || 
    (item.lecturer && item.lecturer.toLowerCase().includes(search))
  );

  // Sort
  filtered.sort((a, b) => {
    const dateA = new Date(a.created_at);
    const dateB = new Date(b.created_at);
    return sort === 'newest' ? dateB - dateA : dateA - dateB;
  });

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No records found.</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(item => `
    <tr>
      <td>${item.student_id || 'N/A'}</td>
      <td>${item.course || 'N/A'}</td>
      <td>${item.lecturer || 'N/A'}</td>
      <td>${new Date(item.created_at).toLocaleString()}</td>
    </tr>
  `).join('');
}

function downloadCSV() {
  if (allData.length === 0) return alert("No data to download");
  
  const headers = ["Student ID", "Course", "Lecturer", "Date & Time"];
  const csvRows = [];
  
  csvRows.push(headers.join(','));
  
  allData.forEach(item => {
    const date = new Date(item.created_at).toLocaleString().replace(/,/g, '');
    csvRows.push(`"${item.student_id}","${item.course}","${item.lecturer}","${date}"`);
  });
  
  const csvString = csvRows.join('\n');
  const blob = new Blob([csvString], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', 'attendance_records.csv');
  a.click();
}

function logout() {
  sessionStorage.removeItem('admin_pin');
  window.location.href = 'admin-login.html';
}

// Initialize
fetchData();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Admin Login</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --bg-dark: #0a0a0f;
    --bg-gradient: radial-gradient(circle at top, #1a1a2e 0%, #0a0a0f 100%);
    --glass-bg: rgba(20, 20, 30, 0.6);
    --glass-border: rgba(255, 255, 255, 0.08);
    --text-main: #f5f5f5;
    --gold-primary: #d4af37;
    --gold-hover: #f1d56b;
  }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .login-card {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 16px;
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    width: 100%;
    max-width: 400px;
    text-align: center;
    animation: fadeIn 0.6s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h2 { color: var(--gold-primary); margin-top: 0; margin-bottom: 30px; }
  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    color: white;
    font-size: 16px;
    box-sizing: border-box;
  }
  input:focus {
    outline: none;
    border-color: var(--gold-primary);
  }
  button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--gold-primary), #b8860b);
    color: #111;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
  }
  button:hover { background: var(--gold-hover); transform: translateY(-2px); }
  #errorMsg { color: #ff6b6b; font-size: 14px; margin-top: 15px; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <h2>Admin Portal</h2>
  <input type="password" id="adminPin" placeholder="Enter Admin PIN" required>
  <button onclick="login()">Access Dashboard</button>
  <div id="errorMsg">Invalid PIN. Please try again.</div>
</div>

<script>
const API_URL = "https://attendance-system-backend-3ppe.onrender.com/api";

async function login() {
  const pin = document.getElementById('adminPin').value.trim();
  const errorMsg = document.getElementById('errorMsg');
  
  if(!pin) return alert("Please enter the Admin PIN");

  try {
    const res = await fetch(`${API_URL}/admin/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ admin_pin: pin })
    });
    
    const data = await res.json();
    
    if (data.ok) {
      // Save PIN to session storage for the dashboard to use
      sessionStorage.setItem('admin_pin', pin);
      window.location.href = 'admin-dashboard.html';
    } else {
      errorMsg.style.display = 'block';
    }
  } catch (err) {
    alert("Login error: " + err.message);
  }
}

// Allow pressing "Enter" to login
document.getElementById('adminPin').addEventListener('keypress', function (e) {
  if (e.key === 'Enter') login();
});
</script>
</body>
</html>
